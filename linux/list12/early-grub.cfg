set root=(memdisk)
set prefix=($root)/
loadfont terminus16x32
set gfxmode=auto
set gfxpayload=keep
set gfxterm_font=terminus16x32
terminal_output gfxterm
set home_uuid=3c3d7aa7-b714-4ca1-b9a7-89cdc4ad893f
cryptomount -u $home_uuid
set root=cryptouuid/$home_uuid
set prefix=($root)/grub
configfile grub.cfg
